}

    --paper: #2a2721;
    --ink: #f2eee4;
    --muted: #b8b2a4;
    --blue-box: #22354f;
    --blue-line: #3d5a80;
    --line: #45403a;
  }

  min-width: 0;

  box-sizing: border-box;

  max-width: 100%;
  height: auto;

  width: 100%;
  border-collapse: collapse;
  display: block;
  overflow-x: auto;

  word-break: break-word;

  height: 6px;
}

  background: rgba(255,255,255,.35);
  border-radius: 999px;
}

  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(30,58,95,.06);
}

.key-box {
  background: var(--blue-box);
  border: 1px solid var(--blue-line);
  border-radius: 10px;
}

.kw-row {
  display: grid;
  grid-template-columns: minmax(118px, 32%) 1fr;
  gap: 14px;
  padding: 12px 4px;
  border-top: 1px dashed var(--line);
}

@media (max-width: 560px) {
  .kw-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}
