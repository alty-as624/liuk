/*
1. Correct the odd appearance in Chrome and Safari.
2. Correct the outline style in Safari.
*/

[type='search'] {
  -webkit-appearance: textfield;
  /* 1 */
  outline-offset: -2px;
  /* 2 */
}

/*
Remove the inner padding in Chrome and Safari on macOS.
*/

::-webkit-search-decoration {
  -webkit-appearance: none;
}

/*
1. Correct the inability to style clickable types in iOS and Safari.
2. Change font properties to `inherit` in Safari.
*/

::-webkit-file-upload-button {
  -webkit-appearance: button;
  /* 1 */
  font: inherit;
  /* 2 */
}

/*
Add the correct display in Chrome and Safari.
*/

summary {
  display: list-item;
}

/*
Removes the default spacing and border for appropriate elements.
*/

blockquote,
dl,
dd,
h1,
h2,
h3,
h4,
h5,
h6,
hr,
figure,
p,
pre {
  margin: 0;
}

fieldset {
  margin: 0;
  padding: 0;
}

legend {
  padding: 0;
}

ol,
ul,
menu {
  list-style: none;
  margin: 0;
  padding: 0;
}

/*
Reset default styling for dialogs.
*/

dialog {
  padding: 0;
}

/*
Prevent resizing textareas horizontally by default.
*/

textarea {
  resize: vertical;
}

/*
1. Reset the default placeholder opacity in Firefox. (https://github.com/tailwindlabs/tailwindcss/issues/3300)
2. Set the default placeholder color to the user's configured gray 400 color.
*/

input::-moz-placeholder, textarea::-moz-placeholder {
  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */
}

input::placeholder,
textarea::placeholder {
  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */
}

/*
Set the default cursor for buttons.
*/

button,
[role="button"] {
  cursor: pointer;
}

/*
Make sure disabled buttons don't get the pointer cursor.
*/

:disabled {
  cursor: default;
}

/*
1. Make replaced elements `display: block` by default. (https://github.com/mozdevs/cssremedy/issues/14)
2. Add `vertical-align: middle` to align replaced elements more sensibly by default. (https://github.com/jensimmons/cssremedy/issues/14#issuecomment-634934210)
   This can trigger a poorly considered lint error in some tools but is included by design.
*/

img,
svg,
video,
canvas,
audio,
iframe,
embed,
object {
  display: block;
  /* 1 */
  vertical-align: middle;
  /* 2 */
}

/*
Constrain images and videos to the parent width and preserve their intrinsic aspect ratio. (https://github.com/mozdevs/cssremedy/issues/14)
*/

img,
video {
  max-width: 100%;
  height: auto;
}

/* Make elements with the HTML hidden attribute stay hidden by default */

[hidden]:where(:not([hidden="until-found"])) {
  display: none;
}

.visible {
  visibility: visible;
}

.invisible {
  visibility: hidden;
}

.absolute {
  position: absolute;
}

.sticky {
  position: sticky;
}

.block {
  display: block;
}

.flex {
  display: flex;
}

.grid {
  display: grid;
}

.hidden {
  display: none;
}

.border {
  border-width: 1px;
}

.uppercase {
  text-transform: uppercase;
}

.underline {
  text-decoration-line: underline;
}

.shadow {
  --tw-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 1px 3px 0 var(--tw-shadow-color), 0 1px 2px -1px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline {
  outline-style: solid;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root {
  --cream: #f7f3eb;
  --navy: #1e3a5f;
  --navy-deep: #152a45;
  --paper: #ffffff;
  --ink: #22241f;
  --muted: #6b6a61;
  --blue-box: #eaf2fb;
  --blue-line: #b9d0ea;
  --gold: #c9a86a;
  --line: #e6dfd0;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--cream);
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
}

a {
  color: var(--navy);
}

@media (prefers-color-scheme: dark) {
  :root {
    --cream: #1e1c18;
    --paper: #2a2721;
    --ink: #f2eee4;
    --muted: #b8b2a4;
    --blue-box: #22354f;
    --blue-line: #3d5a80;
    --line: #45403a;
  }
}

.injected-content {
  width: 100%;
  min-width: 0;
}

.injected-content * {
  max-width: 100%;
  box-sizing: border-box;
}

.injected-content img {
  max-width: 100%;
  height: auto;
}

.injected-content table {
  width: 100%;
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
}

.injected-content p, .injected-content li, .injected-content td, .injected-content th {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.filter-scroll {
  scrollbar-width: thin;
}

.filter-scroll::-webkit-scrollbar {
  height: 6px;
}

.filter-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.35);
  border-radius: 999px;
}

.fallback-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(30,58,95,.06);
}

.key-box {
  background: var(--blue-box);
  border: 1px solid var(--blue-line);
  border-radius: 10px;
}

.kw-row {
  display: grid;
  grid-template-columns: minmax(118px, 32%) 1fr;
  gap: 14px;
  padding: 12px 4px;
  border-top: 1px dashed var(--line);
}

@media (max-width: 560px) {
  .kw-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}

rman French · Later: Middle English. Wales: Welsh · Scotland: Gaelic / Scots · NI: Irish Gaelic + Ulster Scots."},{k:"MOCK 15 · 1776 North America",v:"“No taxation without representation” — 13 colonies claimed independence."},{k:"MOCK 15 · Commonwealth (1) 17th-century — 唔好混淆",v:"When Charles I was executed 1649, England declared itself a republic called the Commonwealth, no monarch, Cromwell Lord Protector."},{k:"MOCK 15 · Commonwealth (2) Modern — 唔好混淆",v:"Modern Commonwealth: association of countries supporting each other, shared goals in democracy and development, most were once part of British Empire, a few non-Empire countries also joined. ⚠️ 兩個 Commonwealth 係 DIFFERENT."},{k:"MOCK 15/16 · Harry Potter + James Bond",v:"Harry Potter: UK-produced, one of most commercially successful films of all time + one of highest-grossing film franchises. James Bond = the other highest-grossing British franchise. Both = highest-grossing British franchises."},{k:"MOCK 15 · First farmers",v:"Arrived Britain around 4000 BC (from south-east Europe)."},{k:"MOCK 15 · WWI ended",v:"11:00, 11 November 1918 — Remembrance Day."},{k:"MOCK 15 · Forced marriage protection",v:"Court orders can be obtained to protect a person from being forced into a marriage, or to protect a person in a forced marriage. Protections: Forced Marriage Protection Order (FMPO) · police can help · Forced Marriage Unit · forced marriage is criminal offence."},{k:"MOCK 15/18 · Arranged marriage (own row)",v:"Arranged marriage: both agree, acceptable in UK, families choose but both free to say yes/no. Contrast forced marriage (no consent = offence)."},{k:"MOCK 15 · Mary Peters",v:"Gold Medal, pentathlon, 1972 Olympics (Munich), Northern Ireland."},{k:"MOCK 15/16 · Youth Court (simplified but complete — 只寫一次，唔重複兩次)",v:"England / Wales / NI · accused 10–17 · heard in Youth Court in front of up to 3 specially trained magistrates or a District Judge. Serious cases go to Crown Court. Parents/carers expected to attend.
