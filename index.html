<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life in the UK – Thematic Keywords</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f7f3eb; font-family: system-ui, -apple-system, sans-serif; }
    .theme-block { background: #fffdf8; border: 1px solid #e5e0d5; border-radius: 12px; }
    .key-point { background: #eef4fb; border-left: 4px solid #3b82f6; }
    .item-row { border-bottom: 1px solid #f0ebe3; }
    .item-row:last-child { border-bottom: none; }
    .extra-label { font-size: 0.7rem; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 0.75rem; padding-top: 0.5rem; border-top: 2px dashed #cbd5e1; }
    .sticky-bar { position: sticky; top: 0; z-index: 50; }
  </style>
</head>
<body class="min-h-screen text-gray-800">
  <!-- Sticky top bar -->
  <div class="sticky-bar bg-[#1e3a5f] text-white text-center py-2 px-3 shadow">
    <a href="https://domicch.github.io/life-in-uk/" target="_blank" rel="noopener"
       class="text-sm font-medium underline underline-offset-2 hover:text-blue-200">
      Life in the UK Test
    </a>
  </div>

  <header class="bg-[#1e3a5f] text-white py-4 px-4 text-center">
    <h1 class="text-xl sm:text-2xl font-bold">Life in the UK – Thematic Keywords</h1>
    <p class="text-sm opacity-90 mt-1">主題關聯 · 一眼睇晒 · 考試常問重點</p>
  </header>

  <div class="max-w-3xl mx-auto px-3 py-5">
    <input id="search" type="search" placeholder="搜尋主題、人物、日期…" 
           class="w-full px-4 py-2.5 rounded-lg border border-gray-300 shadow-sm mb-5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />

    <div class="flex flex-wrap gap-2 mb-6 text-sm" id="filters">
      <button data-filter="all" class="filter-btn active px-3 py-1 rounded-full bg-[#1e3a5f] text-white">全部</button>
      <button data-filter="nations" class="filter-btn px-3 py-1 rounded-full bg-white border">四國</button>
      <button data-filter="romans" class="filter-btn px-3 py-1 rounded-full bg-white border">羅馬</button>
      <button data-filter="tudors" class="filter-btn px-3 py-1 rounded-full bg-white border">Henry VIII</button>
      <button data-filter="civilwar" class="filter-btn px-3 py-1 rounded-full bg-white border">內戰</button>
      <button data-filter="votes" class="filter-btn px-3 py-1 rounded-full bg-white border">婦女投票</button>
      <button data-filter="science" class="filter-btn px-3 py-1 rounded-full bg-white border">科學家</button>
      <button data-filter="sport" class="filter-btn px-3 py-1 rounded-full bg-white border">運動</button>
      <button data-filter="culture" class="filter-btn px-3 py-1 rounded-full bg-white border">文化節日</button>
      <button data-filter="gov" class="filter-btn px-3 py-1 rounded-full bg-white border">政府法律</button>
      <button data-filter="history" class="filter-btn px-3 py-1 rounded-full bg-white border">其他歷史</button>
      <button data-filter="values" class="filter-btn px-3 py-1 rounded-full bg-white border">價值觀</button>
    </div>

    <main id="main" class="space-y-6"></main>
    <div id="empty" class="hidden text-center py-16 text-gray-500">冇搵到相關內容</div>
  </div>

  <footer class="text-center text-xs text-gray-500 py-8 px-4">
    Based on official handbook + high-frequency items from 18 mock tests · For personal revision only
  </footer>

  <script>
    const themes = [
      {
        id: "nations",
        title: "四國一覽 (Nations of the UK)",
        keyPoint: "每個國家：Patron Saint + 國慶日 + 國花/標誌 + 首都。Union Flag 冇 Welsh dragon。",
        items: [
          { k: "England", v: "St George · 23 April · Rose · London" },
          { k: "Scotland", v: "St Andrew · 30 November · Thistle · Edinburgh · Hogmanay (31 Dec)" },
          { k: "Wales", v: "St David · 1 March · Daffodil / Leek · Cardiff" },
          { k: "Northern Ireland", v: "St Patrick · 17 March · Shamrock · Belfast" },
          { k: "Union Flag / Union Jack", v: "St George + St Andrew + St Patrick crosses (no Welsh dragon)" },
          { k: "Great Britain vs UK", v: "GB = England + Scotland + Wales | UK = GB + Northern Ireland" },
          { k: "Loch Lomond & The Trossachs", v: "National Park located in Scotland" },
          { k: "Stonehenge", v: "Prehistoric monument in Wiltshire, England" }
        ],
        extras: [
          { k: "Scottish Parliament", v: "129 members (MSPs)" },
          { k: "Northern Ireland Assembly", v: "90 members (MLAs)" },
          { k: "Welsh Senedd", v: "Old handbook: 60 members · From May 2026: 96 members" }
        ]
      },
      {
        id: "romans",
        title: "羅馬時期 (Romans in Britain)",
        keyPoint: "Hadrian’s Wall 邊個起、目的、相關 forts；Boudicca 對抗羅馬。",
        items: [
          { k: "Hadrian’s Wall", v: "Emperor Hadrian · keep out the Picts · forts: Housesteads & Vindolanda" },
          { k: "Boudicca", v: "Queen of the Iceni (eastern England) · fought the Romans" },
          { k: "Romans left", v: "Around AD 410 (after ~400 years)" }
        ]
      },
      {
        id: "tudors",
        title: "Henry VIII & Tudors",
        keyPoint: "為離婚第一任妻子建立 Church of England；Anne Boleyn 喺 Tower of London 被斬；Elizabeth I 老豆；Reformation。",
        items: [
          { k: "Why Church of England?", v: "Henry wanted to divorce Catherine of Aragon → Pope refused → established Church of England" },
          { k: "Six wives mnemonic", v: "Divorced – Beheaded – Died – Divorced – Beheaded – Survived" },
          { k: "1. Catherine of Aragon", v: "Divorced" },
          { k: "2. Anne Boleyn", v: "Beheaded at Tower of London · mother of Elizabeth I" },
          { k: "3. Jane Seymour", v: "Died (after giving birth to Edward VI)" },
          { k: "4. Anne of Cleves", v: "Divorced" },
          { k: "5. Catherine Howard", v: "Beheaded" },
          { k: "6. Catherine Parr", v: "Survived (outlived Henry)" },
          { k: "Elizabeth I", v: "Daughter of Henry VIII & Anne Boleyn · defeated Spanish Armada 1588 · never married" },
          { k: "Reformation", v: "Movement against the authority of the Pope (Henry VIII’s time)" }
        ]
      },
      {
        id: "civilwar",
        title: "英國內戰 (Civil War) & Glorious Revolution",
        keyPoint: "Cavaliers (國王) vs Roundheads (國會)；Charles I 被斬；Cromwell = Lord Protector；Glorious Revolution → Constitutional Monarchy。",
        items: [
          { k: "Civil War sides", v: "Cavaliers = supported the King | Roundheads = supported Parliament" },
          { k: "Charles I", v: "Believed in Divine Right of Kings · executed 1649 → England became a republic" },
          { k: "Oliver Cromwell", v: "Leader of the Roundheads · became Lord Protector (not king)" },
          { k: "Restoration", v: "1660 – monarchy restored under Charles II" },
          { k: "Glorious Revolution", v: "1688 · James II replaced by William & Mary · beginning of constitutional monarchy" }
        ]
      },
      {
        id: "votes",
        title: "婦女投票權 (Women’s Suffrage)",
        keyPoint: "Emmeline Pankhurst = suffragettes 領袖；1918（30歲+）→ 1928（同男性 21歲）。",
        items: [
          { k: "Emmeline Pankhurst", v: "Leader of the suffragettes (women’s right to vote)" },
          { k: "1918", v: "Women over 30 got the vote (and right to stand for Parliament)" },
          { k: "1928", v: "Women got the vote at 21 – same as men" }
        ]
      },
      {
        id: "science",
        title: "科學家 & 發明家",
        keyPoint: "多數一對一：名 + 最出名成就。",
        items: [
          { k: "Isaac Newton", v: "Laws of motion & gravity · Principia Mathematica" },
          { k: "Charles Darwin", v: "Theory of evolution · On the Origin of Species (1859)" },
          { k: "Alexander Fleming", v: "Discovered penicillin (1928) · Scottish" },
          { k: "Tim Berners-Lee", v: "Invented the World Wide Web (1989) · CERN" },
          { k: "John Logie Baird", v: "Invented television · first broadcast London–Glasgow" },
          { k: "Alan Turing", v: "Codebreaking (Enigma) + computing pioneer · Bletchley Park" },
          { k: "James Watt", v: "Improved the steam engine · Industrial Revolution" },
          { k: "Isambard Kingdom Brunel", v: "Engineer: bridges, railways, ships (GWR, SS Great Britain)" },
          { k: "Florence Nightingale", v: "Founder of modern nursing · Crimean War" },
          { k: "Francis Crick", v: "Co-discovered DNA structure (1953) with Watson" },
          { k: "Sir Frank Whittle", v: "Invented the jet engine" }
        ]
      },
      {
        id: "sport",
        title: "運動員 & 賽事",
        keyPoint: "1966 World Cup、Olympics 主辦年、主要賽事地點好常出。",
        items: [
          { k: "1966 World Cup", v: "England won · Captain Bobby Moore · only time England won it" },
          { k: "Bobby Moore", v: "England football captain 1966" },
          { k: "Sir Roger Bannister", v: "First man to run a mile under 4 minutes (1954)" },
          { k: "Sir Andy Murray", v: "Scottish · Wimbledon 2013 & 2016 · Olympic gold" },
          { k: "Baroness Tanni Grey-Thompson", v: "Paralympian · 16 medals (11 gold) · 6× London Marathon" },
          { k: "Sir Chris Hoy", v: "Scottish cyclist · 6 Olympic golds" },
          { k: "Olympics hosted by UK", v: "1908, 1948, 2012 (all London)" },
          { k: "The Boat Race", v: "Oxford vs Cambridge · annual rowing race on the River Thames" },
          { k: "Grand National", v: "Famous horse race at Aintree (near Liverpool)" },
          { k: "Scottish Grand National", v: "Takes place at Ayr Racecourse" }
        ]
      },
      {
        id: "culture",
        title: "文化、文學、音樂、節日、建築",
        keyPoint: "Hogmanay、Diwali、Tower of London / Beefeaters、文學家同音樂家、Remembrance Day。",
        items: [
          { k: "Hogmanay", v: "Scotland – 31 December (New Year’s Eve)" },
          { k: "Diwali", v: "Hindus & Sikhs · Festival of Lights · Oct/Nov · lasts 5 days" },
          { k: "Remembrance Day", v: "11 November · poppies · remembers those who died in the wars" },
          { k: "Tower of London", v: "Yeoman Warders (Beefeaters) give tours · Crown Jewels kept here · started by William the Conqueror" },
          { k: "Big Ben / Elizabeth Tower", v: "Clock tower at the Houses of Parliament · Big Ben is the bell" },
          { k: "Sir Arthur Conan Doyle", v: "Creator of Sherlock Holmes" },
          { k: "Geoffrey Chaucer", v: "The Canterbury Tales · ‘father of English literature/poetry’ · first writer buried in Poets’ Corner, Westminster Abbey" },
          { k: "Edward Elgar", v: "Composer · Pomp and Circumstance / Land of Hope and Glory · Enigma Variations" },
          { k: "London West End", v: "Also known as ‘Theatreland’ · famous for theatres" },
          { k: "The Proms", v: "Eight-week summer classical music season · Royal Albert Hall" },
          { k: "The Beatles", v: "Most famous British pop/rock band · Liverpool" },
          { k: "J.K. Rowling", v: "Harry Potter series" },
          { k: "Four Weddings and a Funeral", v: "1994 film directed by Mike Newell" }
        ]
      },
      {
        id: "gov",
        title: "政府、法律、責任",
        keyPoint: "責任、投票年齡、unwritten constitution、Magna Carta、Bill of Rights、Jury service。",
        items: [
          { k: "Two key responsibilities", v: "Look after yourself & your family · Look after the area you live in and the environment" },
          { k: "Voting age", v: "18 (UK general elections)" },
          { k: "British constitution", v: "Unwritten (not in a single document)" },
          { k: "Constitutional monarchy", v: "Monarch is head of state but political power lies with elected Parliament" },
          { k: "Magna Carta (1215)", v: "King John forced to sign · king no longer above the law" },
          { k: "Bill of Rights (1689)", v: "Limits monarch’s power · confirms rights of Parliament" },
          { k: "Habeas Corpus", v: "No one can be held prisoner unlawfully · right to a court hearing" },
          { k: "Speaker", v: "Chairs debates in the House of Commons" },
          { k: "Jury service", v: "Compulsory for most adults aged 18–75" },
          { k: "Small claims (England & Wales)", v: "Claims up to £10,000 can use the small claims procedure" },
          { k: "Margaret Thatcher", v: "First woman Prime Minister (1979–1990) · 戴卓爾夫人" }
        ]
      },
      {
        id: "history",
        title: "其他重要歷史事件",
        keyPoint: "日期 + 事件一齊記。1066、1215、1707、1801、1918、1948 特別高頻。",
        items: [
          { k: "Alfred the Great", v: "Defeated the Vikings · united Anglo-Saxon kingdoms" },
          { k: "1066", v: "Battle of Hastings · Norman Conquest · William the Conqueror defeats Harold" },
          { k: "1215", v: "Magna Carta signed" },
          { k: "1348", v: "Black Death (Middle Ages) arrived · killed large proportion of population" },
          { k: "1485", v: "Battle of Bosworth · start of Tudors · ends Wars of the Roses" },
          { k: "1603", v: "Union of the Crowns · James VI of Scotland becomes James I of England" },
          { k: "1605", v: "Gunpowder Plot (Guy Fawkes) · origin of Bonfire Night" },
          { k: "1707", v: "Act of Union (England + Scotland) → Kingdom of Great Britain" },
          { k: "1801", v: "Act of Union with Ireland → United Kingdom of Great Britain and Ireland" },
          { k: "1918", v: "End of World War I · women over 30 get the vote" },
          { k: "Battle of Britain (1940)", v: "RAF defeated the German Luftwaffe · Winston Churchill was Prime Minister" },
          { k: "Winston Churchill", v: "Prime Minister during most of WWII · famous wartime speeches" },
          { k: "NHS established", v: "1948" },
          { k: "Windrush", v: "1948 · ship that brought workers from the Caribbean · post-war immigration" },
          { k: "Wars of the Roses", v: "Lancaster (red rose) vs York (white rose) · ended 1485 at Bosworth" }
        ],
        extras: [
          { k: "Commonwealth", v: "Voluntary association of independent countries, most of which were formerly part of the British Empire" }
        ]
      },
      {
        id: "values",
        title: "英國核心價值觀 (British Values)",
        keyPoint: "Chapter 1 重點：所有住喺英國嘅人都應該尊重同支持呢啲價值。",
        items: [
          { k: "Fundamental British values", v: "Democracy · Rule of law · Individual liberty · Mutual respect and tolerance of those with different faiths and beliefs" },
          { k: "Democracy", v: "People elect their representatives · government is accountable" },
          { k: "Rule of law", v: "Everyone is equal under the law · including those in power" },
          { k: "Individual liberty", v: "Freedom of speech, thought, religion and association" },
          { k: "Mutual respect & tolerance", v: "Respect the rights of others to hold different beliefs and opinions" }
        ]
      }
    ];

    const main = document.getElementById('main');
    const empty = document.getElementById('empty');
    const searchInput = document.getElementById('search');

    function render(filter = 'all', query = '') {
      main.innerHTML = '';
      let hasResults = false;
      const q = query.toLowerCase().trim();

      themes.forEach(theme => {
        if (filter !== 'all' && theme.id !== filter) return;

        const mainItems = theme.items.filter(item => !q || (item.k + ' ' + item.v + ' ' + theme.title).toLowerCase().includes(q));
        const extraItems = (theme.extras || []).filter(item => !q || (item.k + ' ' + item.v + ' ' + theme.title).toLowerCase().includes(q));
        if (mainItems.length === 0 && extraItems.length === 0) return;
        hasResults = true;

        const section = document.createElement('section');
        section.className = 'theme-block p-4 shadow-sm';

        let html = `
          <h2 class="text-base font-bold text-[#1e3a5f] mb-1">${theme.title}</h2>
          <div class="key-point text-sm p-2.5 rounded mb-3">${theme.keyPoint}</div>
          <div class="space-y-0">
        `;

        mainItems.forEach(item => {
          html += `
            <div class="item-row py-2 flex gap-3 text-sm">
              <div class="font-medium text-[#1e3a5f] min-w-[130px] sm:min-w-[160px] shrink-0">${item.k}</div>
              <div class="text-gray-700">${item.v}</div>
            </div>
          `;
        });

        if (extraItems.length > 0) {
          html += `<div class="extra-label">Handbook extras / less frequent in mocks</div>`;
          extraItems.forEach(item => {
            html += `
              <div class="item-row py-2 flex gap-3 text-sm opacity-80">
                <div class="font-medium text-[#1e3a5f] min-w-[130px] sm:min-w-[160px] shrink-0">${item.k}</div>
                <div class="text-gray-700">${item.v}</div>
              </div>
            `;
          });
        }

        html += `</div>`;
        section.innerHTML = html;
        main.appendChild(section);
      });

      empty.classList.toggle('hidden', hasResults);
    }

    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active', 'bg-[#1e3a5f]', 'text-white');
        b.classList.add('bg-white', 'border');
      });
      e.target.classList.add('active', 'bg-[#1e3a5f]', 'text-white');
      e.target.classList.remove('bg-white', 'border');
      render(e.target.dataset.filter, searchInput.value);
    });

    searchInput.addEventListener('input', () => {
      const active = document.querySelector('.filter-btn.active');
      render(active ? active.dataset.filter : 'all', searchInput.value);
    });

    render();
  </script>
</body>
</html>
